name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: tests + lint + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Tests JVM de todos los módulos: dominio, Room y Compose con Robolectric, ViewModels, red con MockWebServer.
      - run: ./gradlew testDebugUnitTest :core:domain:test :core:model:test
      - run: ./gradlew lintDebug
      - run: ./gradlew assembleDebug
      - name: Informes de tests y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'
      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: lol-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
